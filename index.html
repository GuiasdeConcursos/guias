<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Sincronização e Prioridades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1a;
    --bg2:#0f1826;
    --panel:#111d2e;
    --panel-2:#0d1826;
    --line: rgba(92,214,214,0.055);
    --border: rgba(219,228,238,0.09);
    --text:#dbe4ee;
    --text-dim:#63768b;
    --amber:#ffb454;
    --cyan:#5cd6d6;
    --ok:#4ade80;
    --err:#f87171;
    --purple:#b39ddb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/38px 38px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/38px 38px,
      radial-gradient(ellipse at 15% 0%, rgba(92,214,214,0.06), transparent 45%),
      radial-gradient(ellipse at 90% 100%, rgba(255,180,84,0.05), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    padding:28px 20px 70px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  /* header */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;
    margin-bottom:6px;
  }
  .title-block h1{
    font-family:'JetBrains Mono',monospace;
    font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-0.01em;
    display:flex;align-items:center;gap:10px;
  }
  .title-block h1 .bracket{color:var(--text-dim);font-weight:400;}
  .title-block .endpoint-line{
    font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--text-dim);
    margin-top:6px;word-break:break-all;max-width:600px;
  }

  .status-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--border);
    padding:8px 14px;border-radius:8px;
    font-family:'JetBrains Mono',monospace;font-size:0.78rem;
    white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex-shrink:0;}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .dot.err{background:var(--err);box-shadow:0 0 8px var(--err);}
  .dot.pending{background:var(--amber);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .meta-row{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    margin:22px 0 18px;
    padding-top:16px;border-top:1px dashed var(--border);
  }
  .meta-left{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--text-dim);}
  .meta-left b{color:var(--cyan);}

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  input[type="text"]{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:9px 13px;border-radius:7px;font-family:'IBM Plex Sans',sans-serif;font-size:0.85rem;
    min-width:200px;
  }
  input[type="text"]::placeholder{color:var(--text-dim);}
  input[type="text"]:focus{outline:none;border-color:var(--cyan);}

  button{cursor:pointer;border-radius:7px;border:none;font-family:'JetBrains Mono',monospace;}
  .btn-refresh{
    background:transparent;border:1px solid var(--cyan);color:var(--cyan);
    padding:9px 16px;font-size:0.78rem;display:flex;align-items:center;gap:7px;
  }
  .btn-refresh:hover{background:rgba(92,214,214,0.08);}
  .btn-refresh svg{width:13px;height:13px;transition:transform .4s ease;}
  .btn-refresh.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* grid of materia cards */
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    max-width:720px;
    margin:0 auto;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:3px solid var(--card-color, var(--cyan));
    border-radius:10px;
    overflow:hidden;
  }
  .card-head{
    padding:14px 16px 12px;
    border-bottom:1px solid var(--border);
    background:var(--panel-2);
  }
  .card-head-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .card-head h3{
    font-family:'JetBrains Mono',monospace;font-size:1rem;margin:0;font-weight:600;
    color:var(--text);
  }
  .node-tag{
    font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--text-dim);
    display:flex;align-items:center;gap:6px;
  }
  .count-badge{
    font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--card-color, var(--cyan));
    border:1px solid currentColor;border-radius:999px;padding:2px 9px;
    white-space:nowrap;
  }

  .assunto-list{padding:6px 0;}
  .assunto-row{
    padding:12px 16px;
    border-bottom:1px solid rgba(219,228,238,0.04);
  }
  .assunto-row:last-child{border-bottom:none;}
  .assunto-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .assunto-idx{
    font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text-dim);
    width:22px;flex-shrink:0;
  }
  .assunto-nome{flex:1;font-size:0.88rem;line-height:1.3;}

  /* --- NOVAS CLASSES PARA PRIORIDADE --- */
  .priority-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
    text-transform: uppercase;
    margin-left: 8px;
    display: inline-flex;
    align-items: center;
    vertical-align: text-bottom;
  }
  .priority-alta {
    background: rgba(248, 113, 113, 0.15);
    color: var(--err);
    border: 1px solid rgba(248, 113, 113, 0.3);
  }
  .priority-media {
    background: rgba(255, 180, 84, 0.15);
    color: var(--amber);
    border: 1px solid rgba(255, 180, 84, 0.3);
  }
  .priority-baixa {
    background: rgba(74, 222, 128, 0.15);
    color: var(--ok);
    border: 1px solid rgba(74, 222, 128, 0.3);
  }
  /* ------------------------------------- */

  .assunto-actions{display:flex;gap:8px;flex-wrap:wrap;padding-left:32px;}
  .action-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono',monospace;font-size:0.7rem;
    padding:6px 12px;border-radius:6px;
    text-decoration:none;
    border:1px solid var(--card-color, var(--cyan));
    color:var(--card-color, var(--cyan));
    background:transparent;
    transition:background .15s ease, color .15s ease;
  }
  .action-btn svg{width:13px;height:13px;flex-shrink:0;}
  .action-btn:hover{background:var(--card-color, var(--cyan));color:var(--bg);}
  .action-btn.disabled{
    border:1px dashed rgba(219,228,238,0.18);
    color:var(--text-dim);
    pointer-events:none;
    opacity:0.55;
  }

  /* skeleton loading */
  .skeleton-grid{display:grid;grid-template-columns:1fr;gap:16px;max-width:720px;margin:0 auto;}
  .skel-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;height:180px;}
  .skel-line{height:12px;border-radius:4px;background:linear-gradient(90deg, var(--panel-2) 25%, var(--border) 50%, var(--panel-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;margin-bottom:12px;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  /* error panel */
  .error-panel{
    grid-column:1/-1;
    background:var(--panel);border:1px solid rgba(248,113,113,0.35);border-radius:10px;
    padding:26px;text-align:center;
  }
  .error-panel h3{font-family:'JetBrains Mono',monospace;color:var(--err);margin:0 0 8px;font-size:1rem;}
  .error-panel p{color:var(--text-dim);font-size:0.85rem;max-width:480px;margin:0 auto 14px;line-height:1.5;}
  .error-panel details{
    text-align:left;max-width:600px;margin:0 auto 14px;
    font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--text-dim);
  }
  .error-panel summary{cursor:pointer;color:var(--cyan);}
  .error-panel pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:6px;margin-top:8px;}
  .btn-retry{
    background:var(--err);color:var(--bg);padding:9px 18px;font-size:0.78rem;font-weight:600;
  }

  .empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:0.85rem;}

  footer{
    margin-top:34px;text-align:center;font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;color:var(--text-dim);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title-block">
      <h1><span class="bracket"></span><span id="page-title">1 - Painel de matérias e assuntos para estudo</span></h1>
      <div class="endpoint-line" id="endpoint-line"></div>
    </div>
    <div class="status-pill">
      <span class="dot pending" id="status-dot"></span>
      <span id="status-text">conectando...</span>
    </div>
  </div>

  <div class="meta-row">
    <div class="meta-left" id="meta-info">última sincronização: <b>—</b></div>
    <div class="controls">
      <input type="text" id="search" placeholder="Buscar matéria ou assunto...">
      <button class="btn-refresh" id="refresh-btn" onclick="fetchData(true)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        sincronizar
      </button>
    </div>
  </div>

  <div id="content">
    <div class="skeleton-grid">
      <div class="skel-card"><div class="skel-line" style="width:60%"></div><div class="skel-line"></div><div class="skel-line" style="width:80%"></div><div class="skel-line" style="width:40%"></div></div>
      <div class="skel-card"><div class="skel-line" style="width:50%"></div><div class="skel-line"></div><div class="skel-line" style="width:70%"></div><div class="skel-line" style="width:55%"></div></div>
      <div class="skel-card"><div class="skel-line" style="width:65%"></div><div class="skel-line"></div><div class="skel-line" style="width:75%"></div><div class="skel-line" style="width:45%"></div></div>
    </div>
    
    <!-- EXEMPLO DE COMO O SEU JS DEVE GERAR O HTML AGORA: 
    <div class="grid">
      <div class="card">
        ...
        <div class="assunto-list">
          <div class="assunto-row">
            <div class="assunto-top">
              <span class="assunto-idx">01</span>
              <span class="assunto-nome">
                Java (6+), API/JavaSE
                <span class="priority-badge priority-alta">Alta</span>
              </span>
            </div>
            ...
          </div>
        </div>
      </div>
    </div>
    -->

  </div>

  <footer>fonte de dados atualizada a cada carregamento da página</footer>
</div>

<script src="painel-dinamico.js?n3"></script>
</body>
</html>
